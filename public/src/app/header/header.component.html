<header class="app-header" id="header">
  <nav class="navbar navbar-expand-md justify-content-between">
    <a class="navbar-brand" title="Forest Operations Map" style="cursor: pointer" (click)="showHome()">
      <span class="navbar-brand__title">Forest Operations Map</span>
    </a>

    <div class="header-notice">
      @if (environmentDisplay) {
        <span class="navbar-environment">{{environmentDisplay}}</span>
      }

      <!-- <div class="downtime-notice">
          <span>Scheduled Maintenance on July 28th, 2026, 4:30–5:00 PM PDT. <br/></span>

      </div> -->
  </div>

  <button class="navbar-toggler" type="button" title="Toggle Main Navigation"
    aria-controls="navbarText"
    aria-expanded="false"
    aria-label="Toggle navigation"
    (click)="toggleNav()">
    <em class="material-icons">menu</em>
  </button>
  <div class="navbar-collapse" [class.nav-open]="isNavMenuOpen" id="mainNav">
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" title="Find FOM Applications in British Columbia" style="cursor: pointer" (click)="showAllFoms()">

        </a>
      </li>
      <div class="v-bar"><div></div></div>
      <li class="nav-item">
        <a class="nav-link" title="About Us" routerLink="/about">

      </li>
      <div class="v-bar"><div></div></div>
      <li class="nav-item">
        <a class="nav-link" title="How-to Videos" href="https://bcgov.github.io/forestry-digital-services/assets/training/FOMpublic/index.html#/lessons/bPu8Fx187gWLV3rC5RjpbKEKkDBwIX93" target="_blank">
          <span>How-to videos</span>
        </a>
      </li>
      <div class="v-bar"><div></div></div>
      <li class="nav-item">
        <a class="nav-link" title="Contact Us" routerLink="/contact">
          <span>Contact us</span>
        </a>
      </li>
    </ul>
  </div>
</nav>
</header>
