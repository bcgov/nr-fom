name: Merge (TEST)

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/ISSUE_TEMPLATE/*"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  vars:
    name: Resolve Images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      pull-requests: read
    strategy:
      matrix:
        package: [admin, api, db, public]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Resolve the image digest built for this commit (squash merges walk back to the PR build)
      - name: Resolve image
        id: tracker
        uses: bcgov/actions/image-tracker@4026bfd276b8a5839029106099b13edfb594b2c3 # v0.8.0
        with:
          package: ${{ matrix.package }}
          max_depth: 100

      # Tag that digest with the merge commit SHA; deploys and promotion use this tag
      - name: Tag image with commit SHA
        uses: shrink/actions-docker-registry-tag@v5
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/${{ matrix.package }}
          target: ${{ steps.tracker.outputs.digest }}
          tags: ${{ github.sha }}

  deploy:
    name: Deploy (TEST)
    needs: [vars]
    permissions:
      contents: read
      issues: write
    secrets: inherit
    uses: ./.github/workflows/.deploy.yml
    with:
      aws_user_pools_web_client_id: 2t6hr174gbtg206ufgvajrlv0g
      batch_client_rfsh_api_tkn_op_secret_name: fom-demo-client-app-api
      db_testdata: true
      environment: test
      email_notify: Heartwood@gov.bc.ca  # TEST environment, set to team inbox.
      logout_siteminder_url: https://logontest7.gov.bc.ca/clp-cgi/logoff.cgi
      logout_keycloak_url: https://test.loginproxy.gov.bc.ca/auth/realms/standard/protocol/openid-connect/logout
      tag: ${{ github.sha }}
      target: test

  images-promote:
    name: Promote images (TEST)
    continue-on-error: true # If no prod tags
    needs: [deploy]
    permissions:
      packages: write
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        component: [api, admin, db, public]
    steps:
      - uses: shrink/actions-docker-registry-tag@v5
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/${{ matrix.component }}
          target: ${{ needs.deploy.outputs.tag }}
          tags: test
