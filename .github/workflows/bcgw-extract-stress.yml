name: BCGW extract stress

# Off unless: Actions → Run workflow, or PR label `bcgw-extract-stress`.
# Requires BCGW_EXTRACT_STRESS=1 (set by npm run test-bcgw-extract-stress).

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, opened, reopened, synchronize]

concurrency:
  group: bcgw-extract-stress-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  memory:
    name: Memory bound (opt-in)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'bcgw-extract-stress'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test-bcgw-extract-stress --workspace=api
