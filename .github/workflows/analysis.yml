name: Analysis

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  schedule:
    - cron: "30 8 1 * *" # 8:30 UDT = 12:30 PDT, runs monthly
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  tests-libs:
    name: Unit Tests (libs)
    if: (! github.event.pull_request.draft)
    runs-on: ubuntu-26.04
    steps:
      - uses: bcgov/actions/test-and-analyse@091f1da89c669d36bf4899830381e5b12d2c889a # v0.11.0
        with:
          commands: |
            cd .. && npm ci --ignore-scripts && cd -
            npm run test-unit
          working_directory: libs
          cache: ""
          node_version: 24
          knip_config: .github/knip.json

  tests-admin:
    name: Unit Tests (admin)
    if: (! github.event.pull_request.draft)
    runs-on: ubuntu-26.04
    steps:
      - uses: bcgov/actions/test-and-analyse@091f1da89c669d36bf4899830381e5b12d2c889a # v0.11.0
        with:
          commands: |
            cd .. && npm ci --ignore-scripts && cd -
            npm run test-unit
          working_directory: admin
          # Workspaces use a single root package-lock.json; the action's npm cache
          # keys on <dir>/package-lock.json (now absent), so disable it to avoid
          # "Some specified paths were not resolved, unable to cache dependencies".
          cache: ""
          node_version: 24
          knip_config: .github/knip.json

  tests-api:
    name: Unit Tests (api)
    if: (! github.event.pull_request.draft)
    runs-on: ubuntu-26.04
    steps:
      - uses: bcgov/actions/test-and-analyse@091f1da89c669d36bf4899830381e5b12d2c889a # v0.11.0
        with:
          commands: |
            cd .. && npm ci --ignore-scripts && cd -
            npm run test-unit
          working_directory: api
          # See note in tests-admin: single root lockfile -> disable per-dir npm cache.
          cache: ""
          node_version: 24
          knip_config: .github/knip.json
          sonar_token: ${{ secrets.SONAR_TOKEN }}
          # npm workspaces use a single hoisted root package-lock.json, so the
          # per-workspace lockfiles were removed by design.
          # The root package.json still has its sibling lock.
          sonar_args: >
            -Dsonar.exclusions=**/*.spec.ts,**/tests/load/**
            -Dsonar.coverage.exclusions=**/tests/load/**
            -Dsonar.javascript.lcov.reportPaths=coverage/api/lcov.info
            -Dsonar.organization=bcgov-sonarcloud
            -Dsonar.projectKey=nr-fom
            -Dsonar.issue.ignore.multicriteria=e1
            -Dsonar.issue.ignore.multicriteria.e1.ruleKey=text:S8564
            -Dsonar.issue.ignore.multicriteria.e1.resourceKey=**/package.json

  tests-public:
    name: Unit Tests (public)
    if: (! github.event.pull_request.draft)
    runs-on: ubuntu-26.04
    steps:
      - uses: bcgov/actions/test-and-analyse@091f1da89c669d36bf4899830381e5b12d2c889a # v0.11.0
        with:
          commands: |
            cd .. && npm ci --ignore-scripts && cd -
            npm run test-unit
          working_directory: public
          # See note in tests-admin: single root lockfile -> disable per-dir npm cache.
          cache: ""
          node_version: 24
          knip_config: .github/knip.json

  # https://github.com/marketplace/actions/aqua-security-trivy
  trivy:
    name: Trivy Security Scan
    if: (! github.event.pull_request.draft)
    permissions:
      security-events: write
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || '' }}

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          format: "sarif"
          output: "trivy-results.sarif"
          ignore-unfixed: true
          scan-type: "fs"
          scanners: "vuln,secret,config"
          severity: "CRITICAL,HIGH"

      # PR uploads must target the branch head ref so retries and merge-ref recalculations do not orphan the scan.
      - name: Upload Trivy scan results to GitHub Security tab (PR)
        if: always() && github.event_name == 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          category: "trivy"
          sarif_file: "trivy-results.sarif"
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          sha: ${{ github.event.pull_request.head.sha }}

      # Push / schedule / workflow_dispatch on main use default ambient ref and sha.
      - name: Upload Trivy scan results to GitHub Security tab
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          category: "trivy"
          sarif_file: "trivy-results.sarif"

  changes:
    name: Detect Changes
    if: (! github.event.pull_request.draft)
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    permissions:
      contents: read
    outputs:
      triggered: ${{ steps.result.outputs.triggered }}
    steps:
      - uses: actions/checkout@v7

      - name: Check triggers
        if: github.event_name == 'pull_request'
        uses: bcgov/actions/diff-triggers@091f1da89c669d36bf4899830381e5b12d2c889a # v0.11.0
        id: diff
        with:
          triggers: |
            admin/
            api/
            db/
            e2e/
            libs/
            public/
            docker-compose.yml
            package.json
            package-lock.json
            playwright.config.ts
            .github/workflows/analysis.yml

      - id: result
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "triggered=true" >> "$GITHUB_OUTPUT"
          else
            echo "triggered=${{ steps.diff.outputs.triggered }}" >> "$GITHUB_OUTPUT"
          fi

  tests-e2e:
    name: E2E Tests (Playwright)
    needs: [changes]
    if: (! github.event.pull_request.draft) && needs.changes.outputs.triggered == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Start services via Compose
        run: docker compose up -d --wait admin public

      - name: Run Playwright E2E tests (Containerized)
        run: docker compose run --rm --no-deps e2e

      - name: Stop services
        if: always()
        run: docker compose down

  # ==========================================================================
  # WARNING: This job acts as the required merge gate for this workflow.
  # If you add a new job to this workflow, you MUST add its ID to the 'needs'
  # array below, otherwise its failure or cancellation will not block the PR!
  # ==========================================================================
  results:
    name: Analysis Results
    needs: [changes, tests-libs, tests-admin, tests-api, tests-public, trivy, tests-e2e]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - name: Analysis Results
        uses: bcgov/actions/workflow-results@091f1da89c669d36bf4899830381e5b12d2c889a # v0.11.0
        with:
          needs: ${{ toJson(needs) }}
          title: 'Analysis Results'
