name: PR Close

on:
  pull_request:
    types: [closed]

concurrency:
  group: ${{ github.event.number }}
  cancel-in-progress: true

permissions:
  packages: write

jobs:
  cleanup:
    name: Cleanup and Images
    uses: bcgov/actions-openshift/.github/workflows/.pr-close.yml@b2757e12d08b7d3bf2c5df7cd58b4cdaf6b3ea71 # v0.11.1
    secrets:
      oc_namespace: ${{ vars.OC_NAMESPACE }}
      oc_token: ${{ secrets.OC_TOKEN }}
    with:
      cleanup: label
      packages: |
        api
        public
        admin
        db
      cleanup_name: fom-${{ github.event.number }}
