name: PR Close

on:
  pull_request:
    types: [closed]

concurrency:
  group: ${{ github.event.number }}
  cancel-in-progress: true

permissions:
  packages: write

jobs:
  cleanup:
    name: Cleanup and Images
    uses: bcgov/actions-openshift/.github/workflows/.pr-close.yml@4dbe4f6d25d14cbdb01e525a302e61e31f96c3ed # v0.5.0
    secrets:
      oc_namespace: ${{ vars.OC_NAMESPACE }}
      oc_token: ${{ secrets.OC_TOKEN }}
    with:
      cleanup: label
      packages: api public admin db
      cleanup_name: fom-${{ github.event.number }}
