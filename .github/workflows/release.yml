name: Release (PROD)

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  promote-release:
    name: Promote Release Tag
    permissions:
      contents: read
      packages: write
      pull-requests: read
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        package: [admin, api, db, public]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve image digest
        id: resolve
        uses: bcgov/actions/image-tracker@acc058abf85bb183dad21b839a92a40a4ff47af3 # v0.14.0
        with:
          packages: ${{ matrix.package }}
          revision: ${{ github.sha }}

      - name: Tag Image as Release
        uses: shrink/actions-docker-registry-tag@e6aaef25c595b6e0edd18bf4c7dbfea3abd43299 # v5
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/${{ matrix.package }}
          target: ${{ steps.resolve.outputs.digest }}
          tags: ${{ github.event.release.tag_name }}

  deploy:
    name: Deploy (PROD)
    needs: [promote-release]
    permissions:
      contents: read
      issues: write
    secrets: inherit
    uses: ./.github/workflows/.deploy.yml
    with:
      batch_client_rfsh_api_tkn_op_secret_name: fom-client-app-api
      environment: prod
      tag: ${{ github.event.release.tag_name }}
      target: prod
      url: fom.nrs.gov.bc.ca

  promote-prod:
    name: Promote Prod Tag
    needs: [deploy]
    permissions:
      packages: write
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        package: [admin, api, db, public]
    timeout-minutes: 5
    steps:
      - uses: shrink/actions-docker-registry-tag@e6aaef25c595b6e0edd18bf4c7dbfea3abd43299 # v5
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/${{ matrix.package }}
          target: ${{ github.event.release.tag_name }}
          tags: prod
