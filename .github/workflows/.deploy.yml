name: .Deploys

on:
  workflow_call:
    inputs:
      ### Required
      # Nothing! Only `secrets: inherit` is required

      ### Typical / recommended
      batch_client_rfsh_api_tkn_op_secret_name:
        description: OP secret name for CLIENT API Token
        default: fom-client-app-api
        type: string
      db_testdata:
        description: Load test data into the database
        default: false
        type: boolean
      email_notify:
        description: Email address for notifications
        default: "" # prod notifications are sent to the district email address set in db.
        type: string
      environment:
        description: GitHub/OpenShift environment; usually PR number, test or prod
        type: string
      tag:
        description: Container tag; usually PR number
        default: ${{ github.event.number }}
        type: string
      target:
        description: Deployment target; usually PR number, test or prod
        default: ${{ github.event.number }}
        type: string
      replica_count:
        description: Number of replicas for each component
        default: 3
        type: number
      triggers:
        description: Paths to check for changes
        type: string
      url:
        description: URL for deployment, does not include path
        type: string

    outputs:
      tag:
        description: Container tag
        value: ${{ jobs.init.outputs.tag }}
      url:
        description: URL for deployment
        value: ${{ jobs.init.outputs.url }}
      triggered:
        description: Did a deployment trigger?
        value: ${{ jobs.init.outputs.triggered }}

permissions: {}

jobs:
  init:
    name: Init
    environment: ${{ inputs.environment }}
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      url: ${{ steps.vars.outputs.url }}
      triggered: ${{ steps.openshift-init.outputs.triggered }}
    runs-on: ubuntu-26.04
    steps:
      - name: Vars
        id: vars
        run: |
          # Set variables
          if [ -z "${{ inputs.tag }}" ]; then
            echo "::error::No tag provided; callers must pass an image tag (merge.yml resolves one with image-tracker)"
            exit 1
          else
            echo "Using tag parameter"
            echo "tag=${{ inputs.tag }}"
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

          if [ ! -z "${{ inputs.url }}" ]; then
            echo "Using URL parameter"
            echo "url=${{ inputs.url }}"
            echo "url=${{ inputs.url }}" >> "$GITHUB_OUTPUT"
          elif [ '${{ github.event_name }}' == 'pull_request' ]; then
            echo "Creating URL from inputs.target (= github.event.number) mod 50"
            echo "url=fom-$(( ${{ inputs.target }} % 50 )).apps.silver.devops.gov.bc.ca"
            echo "url=fom-$(( ${{ inputs.target }} % 50 )).apps.silver.devops.gov.bc.ca" >> "$GITHUB_OUTPUT"
          else
            echo "Creating URL from inputs.target"
            echo "url=fom-${{ inputs.target }}.apps.silver.devops.gov.bc.ca"
            echo "url=fom-${{ inputs.target }}.apps.silver.devops.gov.bc.ca" >> "$GITHUB_OUTPUT"
          fi

      - name: OpenShift Init
        id: openshift-init
        uses: bcgov/actions-openshift/deployer@b2757e12d08b7d3bf2c5df7cd58b4cdaf6b3ea71 # v0.11.1
        with:
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          file: openshift.init.yml
          overwrite: false
          parameters: -p ZONE=${{ inputs.target }}
          triggers: ${{ inputs.triggers }}

  deploy:
    name: Deploy
    environment: ${{ inputs.environment }}
    needs: [init]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      matrix:
        name: [api, admin, db, public]
        include:
          - name: api
            overwrite: true
            parameters:
              -p BATCH_CLIENT_RFSH_API_TKN_OP_SECRET_NAME=${{ inputs.batch_client_rfsh_api_tkn_op_secret_name }}
              -p DB_TESTDATA=${{ inputs.db_testdata }}
              -p FOM_EMAIL_NOTIFY=${{ inputs.email_notify }}
          - name: admin
            overwrite: true
          - name: db
            overwrite: false
          - name: public
            overwrite: true
    steps:
      - uses: bcgov/actions-openshift/deployer@b2757e12d08b7d3bf2c5df7cd58b4cdaf6b3ea71 # v0.11.1
        with:
          file: ${{ matrix.name }}/openshift.deploy.yml
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          overwrite: ${{ matrix.overwrite }}

          # KEYCLOAK_* vars must be read in the step (not strategy.matrix):
          # GitHub evaluates strategy.matrix before binding the job's environment,
          # so vars.* in matrix.include would silently use repo-level DEV values
          # for TEST and PROD.
          parameters:
            -p ZONE=${{ inputs.target }} 
            -p TAG=${{ needs.init.outputs.tag }}
            -p URL=${{ needs.init.outputs.url }}
            ${{ matrix.name != 'db' && format('-p REPLICA_COUNT={0}', inputs.replica_count) || '' }}
            ${{ matrix.name == 'api' && format('-p KEYCLOAK_ISSUER_URI={0} -p KEYCLOAK_CLIENT_ID={1}', vars.KEYCLOAK_ISSUER_URI, vars.KEYCLOAK_CLIENT_ID) || '' }}
            ${{ matrix.parameters }}
          triggers: ${{ inputs.triggers }}

  notify:
    name: Notify Failure
    needs: [init, deploy]
    if: always() && contains(needs.*.result, 'failure') && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: Notify Owners on Failure
        uses: bcgov/actions/workflow-notifier@a25c5f02d20139f29c17c3ceaa41c314ffe92ec9 # v0.16.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "Deployment Failure: FOM (${{ inputs.target }})"

