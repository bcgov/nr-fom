name: Load Test

# Weekly: 100 VUs / 300s against TEST public map (quickstart-openshift shape).
# Never hits PROD. BCGW extract is not in this job.
# Dispatch: target test | pr. PRs only when you pass target=pr and pr=<n>.
on:
  schedule:
    - cron: "0 15 * * 1" # 15:00 UTC Monday
  workflow_dispatch:
    inputs:
      target:
        description: Where to run
        type: choice
        options:
          - test
          - pr
        default: test
      pr:
        description: PR number (required when target is pr)
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  load:
    name: API load tests
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
      - name: Resolve API base URL
        id: url
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET: ${{ github.event.inputs.target }}
          PR: ${{ github.event.inputs.pr }}
        run: |
          if [ "${EVENT_NAME}" = "schedule" ]; then
            TARGET="test"
          fi
          TARGET="${TARGET:-test}"
          case "${TARGET}" in
            test)
              echo "base=https://fom-test.apps.silver.devops.gov.bc.ca/api" >> "$GITHUB_OUTPUT"
              ;;
            pr)
              if ! [[ "${PR}" =~ ^[0-9]+$ ]]; then
                echo "target=pr requires a numeric pr input" >&2
                exit 1
              fi
              echo "base=https://fom-$((PR % 50)).apps.silver.devops.gov.bc.ca/api" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "unknown target: ${TARGET}" >&2
              exit 1
              ;;
          esac
      - uses: grafana/run-k6-action@4082a08c7e40cf6d65863911077dfb60ae0a4f04 # v1.5.0
        env:
          BACKEND_URL: ${{ steps.url.outputs.base }}
        with:
          path: ./api/tests/load/public.js
