---
volumes:
  npm-cache:
  root-node-modules:

services:
  # Single hoisted workspace install into a shared node_modules volume.
  # All other services reuse it (one physical Angular copy -> no NG0203).
  init-deps:
    container_name: init-deps
    image: node:24.18.0-bookworm-slim
    volumes:
      - .:/app:z
      - npm-cache:/root/.npm:z
      - root-node-modules:/app/node_modules
    working_dir: /app
    entrypoint: ["npm", "ci", "--ignore-scripts"]

  admin:
    container_name: admin
    depends_on:
      api:
        condition: service_healthy
      init-deps:
        condition: service_completed_successfully
    entrypoint:
      - sh
      - -c
      - npm run start:admin
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4200/admin', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      retries: 3
      start_period: 60s
      timeout: 5s
    image: node:24.18.0-bookworm-slim
    ports:
      - 4200:4200
    volumes:
      - .:/app:z
      - npm-cache:/root/.npm:z
      - root-node-modules:/app/node_modules
      # Keep the Angular build cache in the container (avoids root-owned .angular on the host)
      - /app/admin/.angular
    working_dir: /app

  api:
    container_name: api
    depends_on:
      db:
        condition: service_healthy
      init-deps:
        condition: service_completed_successfully
    entrypoint:
      - sh
      - -c
      - npm run start:api
    environment:
      - DB_HOST=db
      - DB_NAME=fom
      - DB_PASSWORD=test
      - DB_SSL=false
      - DB_TESTDATA=true
      - DB_TYPE=postgres
      - DB_USERNAME=postgres
      - SECURITY_ENABLED=false
      - BYPASS_CORS=true
      - OBJECT_STORAGE_URL=nrs.objectstore.gov.bc.ca
      - OBJECT_STORAGE_ACCESS_ID=nr-fom-dev
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3333/api', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      retries: 3
      start_period: 60s
      timeout: 5s
    image: node:24.18.0-bookworm-slim
    ports:
      - 3333:3333
    volumes:
      - .:/app:z
      - npm-cache:/root/.npm:z
      - root-node-modules:/app/node_modules
      # Keep nest build output inside the container (avoids root-owned api/dist on the host)
      - /app/api/dist
    working_dir: /app

  db:
    container_name: db
    # Postgis with extensions (postgis_topology, fuzzystrmatch)
    # pgcrypto is enabled by a main DB migration on API startup.
    image: postgis/postgis:18-3.5
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=test
      - POSTGRES_DB=fom
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_PORT=5342
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 3
      start_period: 30s
      timeout: 5s
    ports:
      - 5432:5432

  public:
    container_name: public
    depends_on:
      api:
        condition: service_healthy
      init-deps:
        condition: service_completed_successfully
    entrypoint:
      - sh
      - -c
      - npm run start:public
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4300/public', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      retries: 3
      start_period: 60s
      timeout: 5s
    image: node:24.18.0-bookworm-slim
    ports:
      - 4300:4300
    volumes:
      - .:/app:z
      - npm-cache:/root/.npm:z
      - root-node-modules:/app/node_modules
      # Keep the Angular build cache in the container (avoids root-owned .angular on the host)
      - /app/public/.angular
    working_dir: /app
